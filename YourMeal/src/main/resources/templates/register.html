<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MealMate | Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* ==========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F8FAF8;
            color: #1F2937;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==========================
           NAVIGATION
        ========================== */

        nav {
            width: 100%;
            padding: 22px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: white;
            border-bottom: 1px solid #E5E7EB;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #5F8D4E;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links a {
            text-decoration: none;
            color: #374151;

            padding: 11px 18px;
            border-radius: 12px;

            font-size: 15px;
            font-weight: 500;

            transition: all .25s ease;
        }

        .nav-links a:hover {
            background: #EEF6EE;
            color: #5F8D4E;
        }

        .nav-links .get-started {
            background: #5F8D4E;
            color: white;
        }

        .nav-links .get-started:hover {
            background: #4F7641;
            color: white;
            transform: translateY(-2px);
        }

        /* ==========================
           MAIN
        ========================== */

        .page {
            min-height: calc(100vh - 91px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        /* ==========================
           SIGN UP CARD
        ========================== */

        .signup-card {
            width: 100%;
            max-width: 460px;

            background: white;

            border: 1px solid #E5E7EB;
            border-radius: 28px;

            padding: 45px;

            box-shadow: 0 20px 45px rgba(0, 0, 0, .06);

            animation: fadeUp .7s ease;
        }

        /* ==========================
           HEADER
        ========================== */

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .food-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #EEF6EE;
            border-radius: 20px;

            font-size: 38px;

            box-shadow: 0 10px 25px rgba(95, 141, 78, .10);
        }

        h1 {
            font-size: 36px;
            font-weight: 700;

            color: #1F2937;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 15px;
        }

        /* ==========================
           FORM
        ========================== */

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #374151;

            font-size: 14px;
            font-weight: 600;

            margin-top: 10px;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #D1D5DB;
            border-radius: 12px;

            font-size: 15px;
            color: #1F2937;

            outline: none;

            background: white;

            transition: all .25s ease;
        }

        input::placeholder {
            color: #9CA3AF;
        }

        input:focus {
            border-color: #5F8D4E;

            box-shadow:
                0 0 0 4px rgba(95, 141, 78, .12);
        }

        /* ==========================
           ERROR
        ========================== */

        .form-error {
            background: #FEF2F2;
            color: #DC2626;

            border: 1px solid #FECACA;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 14px;

            margin-bottom: 8px;
        }

        /* ==========================
           CREATE ACCOUNT BUTTON
        ========================== */

        .button {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: none;
            border-radius: 14px;

            background: #5F8D4E;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: all .25s ease;
        }

        .button:hover {
            background: #4F7641;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(95, 141, 78, .20);
        }

        .button:active {
            transform: translateY(0);
        }

        /* ==========================
           SIGN IN LINK
        ========================== */

        .link {
            text-align: center;

            margin-top: 25px;
            padding-top: 25px;

            border-top: 1px solid #F3F4F6;

            color: #6B7280;

            font-size: 14px;
        }

        .link a {
            color: #5F8D4E;

            font-weight: 600;

            text-decoration: none;

            transition: .25s;
        }

        .link a:hover {
            color: #4F7641;
            text-decoration: underline;
        }

        /* ==========================
           DECORATIVE BACKGROUND
        ========================== */

        .decoration {
            position: fixed;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: #EEF6EE;

            opacity: .65;

            z-index: -1;
        }

        .decoration.one {
            top: -100px;
            left: -100px;
        }

        .decoration.two {
            bottom: -120px;
            right: -100px;

            width: 300px;
            height: 300px;
        }

        /* ==========================
           ANIMATION
        ========================== */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            nav {
                padding: 18px 20px;
            }

            .logo {
                font-size: 23px;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-links a {
                padding: 9px 10px;
                font-size: 13px;
            }

            .page {
                padding: 30px 15px;
            }

            .signup-card {
                padding: 32px 25px;
                border-radius: 22px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

    <!-- Decorative Background -->

    <div class="decoration one"></div>
    <div class="decoration two"></div>


    <!-- ==========================
         NAVIGATION
    ========================== -->

    <nav>

        <a href="/" class="logo">
            🍽 MealMate
        </a>

        <div class="nav-links">

            <a href="/login">
                Sign In
            </a>

            <a href="/register" class="get-started">
                Get Started
            </a>

        </div>

    </nav>


    <!-- ==========================
         SIGN UP
    ========================== -->

    <main class="page">

        <div class="signup-card">

            <div class="signup-header">

                <div class="food-icon">
                    🍽️
                </div>

                <h1>
                    Create Account
                </h1>

                <p class="subtitle">
                    Start your healthy journey with MealMate
                </p>

            </div>


            <!-- ==========================
                 SIGN UP FORM
            ========================== -->

            <form class="signup-form"
                  action="/register"
                  method="post">

                <p class="form-error"
                   th:if="${registerError}"
                   th:text="${registerError}">
                </p>


                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    class="button"
                    type="submit">

                    Create Account

                </button>

            </form>


            <!-- ==========================
                 SIGN IN
            ========================== -->

            <div class="link">

                Already have an account?

                <a href="/login">
                    Sign In
                </a>

            </div>

        </div>

    </main>

</body>

</html>
