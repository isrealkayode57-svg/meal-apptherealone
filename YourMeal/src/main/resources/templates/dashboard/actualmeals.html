<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipes - MealMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8f5;
            color: #222;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #ffffff;
            padding: 30px 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            padding: 14px 15px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #333;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #f0f2ed;
        }

        .sidebar form {
            margin-top: 25px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #eee;
        }

        .main {
            margin-left: 240px;
            padding: 45px;
            max-width: 1200px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 36px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .recipe-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .recipe-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .recipe-card h3 {
            margin-top: 22px;
            margin-bottom: 10px;
        }

        .ingredients {
            padding-left: 20px;
        }

        .ingredients li {
            margin-bottom: 7px;
        }

        .instructions {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .empty-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        🍽 MealMate
    </div>

    <a href="/dashboard/dashboard">
        Dashboard
    </a>

    <a href="/dashboard/meals">
        Meals
    </a>

    <a href="/dashboard/actualmeals">
        Recipes
    </a>

    <a href="/dashboard/planner">
        Planner
    </a>

    <a href="/dashboard/grocery">
        Grocery
    </a>

    <a href="/selection">
        Change Restrictions
    </a>

    <a href="/settings">
        Settings
    </a>

    <form action="/logout" method="post">
        <button type="submit">
            Logout
        </button>
    </form>

</div>

<div class="main">

    <div class="header">
        <h1>My Recipes</h1>
        <p>
            Recipes for the meals you've selected.
        </p>
    </div>

    <div
        class="empty-card"
        th:unless="${hasSavedMeals}"
    >
        <p>
            You haven't selected any meals yet.
        </p>

        <p>
            Go to Meals to choose some personalized recipes.
        </p>
    </div>

    <div
        class="recipe-grid"
        th:if="${hasSavedMeals}"
    >

        <div
            class="recipe-card"
            th:each="meal : ${savedMeals}"
        >

            <h2 th:text="${meal.mealNames}">
                Recipe Name
            </h2>

            <h3>Ingredients</h3>

            <ul class="ingredients">
                <li
                    th:each="ingredient : ${meal.ingredients}"
                    th:text="${ingredient}"
                >
                    Ingredient
                </li>
            </ul>

            <h3>Instructions</h3>

            <ol class="instructions">
                <li
                    th:each="instruction : ${meal.instructions}"
                    th:text="${instruction}"
                >
                    Instruction
                </li>
            </ol>

        </div>

    </div>

</div>

</body>
</html>
